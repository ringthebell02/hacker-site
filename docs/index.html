<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="terminal">
        <header class="terminal-header">
            <div class="header-buttons">
                <span class="button red"></span>
                <span class="button yellow"></span>
                <span class="button green"></span>
            </div>
            <div class="header-title">GageTechYT: ~</div>
        </header>
        <main class="terminal-body">
            <nav class="terminal-nav">
                <button class="nav-tab active" data-tab="home">Home</button>
                <button class="nav-tab" data-tab="games">Games</button>
                <button class="nav-tab" data-tab="movies">Movies/TV</button>
                <button class="nav-tab" data-tab="suggestions">Suggestions</button>
                <button class="nav-tab" data-tab="ai">AI</button>
                <button class="nav-tab" data-tab="docs">Docs</button>
            </nav>
            <div class="terminal-content">
                <div id="home" class="content-section active">
                    <p>Welcome to Gage's Wonderful Website</p>
                    <p>Use the tabs above to access our various services</p>
                    <p>To suggest sites, click the 'Suggestions" Button</p>
                </div>
                <div id="games" class="content-section">
                    <div class="button-grid" id="games-grid"></div>
                </div>
                <div id="movies" class="content-section">
                    <div class="button-grid" id="movies-grid"></div>
                </div>
                <div id="suggestions" class="content-section">
                    <div class="button-grid" id="suggestions-grid"></div>
                </div>
                <div id="ai" class="content-section">
                    <div class="button-grid" id="ai-grid"></div>
                </div>
                <div id="docs" class="content-section">
                    <div class="button-grid" id="docs-grid"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
